version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: streetbites-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: streetbites
    ports: 
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - streetbites-network

networks:
  streetbites-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
