services:
  postgres:
    image: postgres:16-alpine
    container_name: streetbites-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: streetbites
    ports: 
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - streetbites-network

  streetbites-api:
    build: .
    container_name: streetbites-api
    ports:
      - "5000:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Server=postgres;Port=5432;Database=streetbites;User Id=postgres;Password=postgres123;
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - streetbites-network

networks:
  streetbites-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
